<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 865" width="1200" height="865" role="img" aria-labelledby="title desc"><title id="title">接线要分清：电从哪里来，控制信号从哪里来</title><desc id="desc">示意连接关系；控制器的供电、PWM、主板同步能力必须查看实物说明</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#087e8b"/></marker><marker id="hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b85c12"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="61" font-size="34" fill="#18324a" font-weight="700" text-anchor="start">接线要分清：电从哪里来，控制信号从哪里来</text><text x="44" y="101" font-size="21" fill="#536779" font-weight="400" text-anchor="start">示意连接关系；控制器的供电、PWM、主板同步能力必须查看实物说明</text><rect x="40" y="140" width="300" height="460" rx="16" fill="#edf3fb" stroke="none" stroke-width="2"/><text x="68" y="187" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">电源 / PSU</text><text x="70" y="246" font-size="27" fill="#18324a" font-weight="600" text-anchor="start">24Pin ATX</text><text x="70" y="340" font-size="27" fill="#18324a" font-weight="600" text-anchor="start">EPS 4+4Pin</text><text x="70" y="434" font-size="27" fill="#18324a" font-weight="600" text-anchor="start">SATA 电源</text><rect x="670" y="140" width="490" height="235" rx="16" fill="#e5f5f5" stroke="none" stroke-width="2"/><text x="698" y="187" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">主板与 CPU</text><text x="700" y="236" font-size="26" fill="#18324a" font-weight="600" text-anchor="start">ATX_PWR：主板主供电</text><text x="700" y="316" font-size="26" fill="#18324a" font-weight="600" text-anchor="start">CPU_12V：CPU 供电</text><path d="M 341 239 L 662 239" fill="none" stroke="#087e8b" stroke-width="5"  marker-end="url(#arr)"/><text x="441" y="225" font-size="22" fill="#087e8b" font-weight="500" text-anchor="start">主供电</text><path d="M 341 332 L 662 315" fill="none" stroke="#087e8b" stroke-width="5"  marker-end="url(#arr)"/><text x="441" y="315" font-size="22" fill="#087e8b" font-weight="500" text-anchor="start">CPU 专用线</text><rect x="670" y="420" width="490" height="180" rx="16" fill="#fff2df" stroke="none" stroke-width="2"/><text x="698" y="467" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">机箱风扇集线器 / 控制器</text><text x="700" y="510" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">SATA：如需外部供电则必须接好</text><text x="700" y="553" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">风扇端口：按套装的接口定义连接</text><path d="M 341 427 L 662 487" fill="none" stroke="#087e8b" stroke-width="5"  marker-end="url(#arr)"/><text x="427" y="441" font-size="22" fill="#087e8b" font-weight="500" text-anchor="start">外部供电</text><rect x="40" y="651" width="1120" height="124" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="69" y="696" font-size="25" fill="#087e8b" font-weight="600" text-anchor="start">主板 CHA_FAN  ─ ─ →  集线器 PWM 输入（仅当集线器支持）</text><text x="69" y="743" font-size="25" fill="#b85c12" font-weight="600" text-anchor="start">主板 ADD_GEN 2 ─ ─ → 控制器 ARGB 同步输入（仅当控制器支持）</text><text x="43" y="823" font-size="23" fill="#536779" font-weight="400" text-anchor="start">CPU 散热器的转速线独立接 CPU_FAN；灯光同步线不能代替电机供电。</text></g></svg>