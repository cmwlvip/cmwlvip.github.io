<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 826" width="1200" height="826" role="img" aria-labelledby="title desc"><title id="title">1TB SSD 是否分 C / D：按管理习惯决定</title><desc id="desc">两种常见方案示意；小分区宽度、位置与容量不按实际比例，安装程序可能调整布局</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#087e8b"/></marker><marker id="hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b85c12"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="61" font-size="34" fill="#18324a" font-weight="700" text-anchor="start">1TB SSD 是否分 C / D：按管理习惯决定</text><text x="44" y="101" font-size="21" fill="#536779" font-weight="400" text-anchor="start">两种常见方案示意；小分区宽度、位置与容量不按实际比例，安装程序可能调整布局</text><rect x="40" y="140" width="1120" height="245" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="187" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">方案 A：一个大的 Windows 分区</text><rect x="70" y="230" width="120" height="84" rx="5" fill="#c6d5e1" stroke="none" stroke-width="2"/><rect x="198" y="230" width="94" height="84" rx="5" fill="#dae3eb" stroke="none" stroke-width="2"/><rect x="300" y="230" width="661" height="84" rx="5" fill="#e5f5f5" stroke="#087e8b" stroke-width="2"/><rect x="970" y="230" width="160" height="84" rx="5" fill="#d5e1eb" stroke="none" stroke-width="2"/><text x="130" y="280" font-size="24" fill="#18324a" font-weight="600" text-anchor="middle">EFI</text><text x="245" y="280" font-size="23" fill="#18324a" font-weight="600" text-anchor="middle">MSR</text><text x="630" y="280" font-size="24" fill="#087e8b" font-weight="600" text-anchor="middle">C: Windows / 软件 / 文件夹分类</text><text x="1050" y="280" font-size="23" fill="#18324a" font-weight="600" text-anchor="middle">恢复分区</text><text x="69" y="354" font-size="23" fill="#536779" font-weight="400" text-anchor="start">空间调配灵活；系统重装前仍需完整备份个人数据。</text><rect x="40" y="414" width="1120" height="245" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="461" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">方案 B：C / D 分开管理</text><rect x="70" y="504" width="120" height="84" rx="5" fill="#c6d5e1" stroke="none" stroke-width="2"/><rect x="198" y="504" width="94" height="84" rx="5" fill="#dae3eb" stroke="none" stroke-width="2"/><rect x="300" y="504" width="284" height="84" rx="5" fill="#e5f5f5" stroke="#087e8b" stroke-width="2"/><rect x="592" y="504" width="369" height="84" rx="5" fill="#edf3fb" stroke="#2865b0" stroke-width="2"/><rect x="970" y="504" width="160" height="84" rx="5" fill="#d5e1eb" stroke="none" stroke-width="2"/><text x="130" y="554" font-size="24" fill="#18324a" font-weight="600" text-anchor="middle">EFI</text><text x="245" y="554" font-size="23" fill="#18324a" font-weight="600" text-anchor="middle">MSR</text><text x="442" y="554" font-size="24" fill="#087e8b" font-weight="600" text-anchor="middle">C: 系统与软件</text><text x="776" y="554" font-size="24" fill="#2865b0" font-weight="600" text-anchor="middle">D: 游戏与个人资料</text><text x="1050" y="554" font-size="23" fill="#18324a" font-weight="600" text-anchor="middle">恢复分区</text><text x="69" y="628" font-size="23" fill="#536779" font-weight="400" text-anchor="start">方便分类，但仍是同一块 SSD；不能抵御整盘故障。</text><rect x="40" y="693" width="1120" height="102" rx="16" fill="#fff2df" stroke="none" stroke-width="2"/><text x="68" y="736" font-size="23" fill="#b85c12" font-weight="600" text-anchor="start">未来安装 Linux：备份后压缩 NTFS 分区，腾出未分配空间，或使用第二块 SSD。</text><text x="68" y="774" font-size="22" fill="#536779" font-weight="400" text-anchor="start">不要格式化已有 EFI、恢复或 Windows 分区；当前分区布局未记录为某一种固定方案。</text></g></svg>