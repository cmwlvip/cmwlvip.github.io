<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 742" width="1200" height="742" role="img" aria-labelledby="title desc"><title id="title">CPU 与 SSD：先对准，再固定</title><desc id="desc">安装动作示意 · 不按比例，省略插槽针脚和扣具细节</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#087e8b"/></marker><marker id="hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b85c12"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="61" font-size="34" fill="#18324a" font-weight="700" text-anchor="start">CPU 与 SSD：先对准，再固定</text><text x="44" y="101" font-size="21" fill="#536779" font-weight="400" text-anchor="start">安装动作示意 · 不按比例，省略插槽针脚和扣具细节</text><rect x="40" y="138" width="545" height="450" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="185" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">AM5 CPU：对齐后轻放</text><rect x="155" y="232" width="250" height="230" rx="16" fill="#c5d6df" stroke="#536779" stroke-width="2"/><rect x="184" y="261" width="192" height="172" rx="11" fill="#fdfefe" stroke="#087e8b" stroke-width="2"/><path d="M192 269 L218 269 L192 295Z" fill="#b85c12"/><text x="282" y="360" font-size="34" fill="#18324a" font-weight="700" text-anchor="middle">CPU</text><path d="M 433 250 L 383 282" fill="none" stroke="#b85c12" stroke-width="4"  marker-end="url(#hot)"/><text x="390" y="221" font-size="23" fill="#b85c12" font-weight="600" text-anchor="start">三角标记</text><text x="67" y="509" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">拿边缘，避免触摸触点</text><text x="67" y="546" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">不要在插槽内滑动 CPU</text><rect x="614" y="138" width="546" height="450" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="642" y="185" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">M.2 SSD：斜插 → 放平 → 固定</text><line x1="675" y1="408" x2="1097" y2="408" stroke="#536779" stroke-width="6" /><rect x="1074" y="365" width="30" height="43" rx="3" fill="#556b7d" stroke="none" stroke-width="2"/><g transform="rotate(17 1072 385)"><rect x="734" y="366" width="340" height="34" rx="4" fill="#2d877c" stroke="none" stroke-width="2"/><text x="903" y="391" font-size="20" fill="white" font-weight="500" text-anchor="middle">M.2 2280 SSD</text></g><path d="M 817 270 L 792 347" fill="none" stroke="#087e8b" stroke-width="4"  marker-end="url(#arr)"/><text x="752" y="247" font-size="24" fill="#087e8b" font-weight="600" text-anchor="start">放平后锁住尾部</text><circle cx="749" cy="413" r="12" fill="#b85c12"/><text x="641" y="509" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">支撑点对准 2280 长度</text><text x="641" y="546" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">导热垫保护膜要撕，SSD 标签保留</text><rect x="40" y="617" width="1120" height="94" rx="16" fill="#fff2df" stroke="none" stroke-width="2"/><text x="67" y="655" font-size="25" fill="#b85c12" font-weight="600" text-anchor="start">安装前断电；CPU 和 SSD 都不应依靠蛮力就位。</text><text x="67" y="690" font-size="21" fill="#536779" font-weight="400" text-anchor="start">本图解释动作原则，未展示具体扣具；塑料锁扣、螺丝和导热垫以实物说明书为准。</text></g></svg>