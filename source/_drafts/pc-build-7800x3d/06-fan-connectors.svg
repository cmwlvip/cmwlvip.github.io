<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 823" width="1200" height="823" role="img" aria-labelledby="title desc"><title id="title">风扇转速、5V ARGB、12V RGB 是三件事</title><desc id="desc">看电压、看缺针、看功能；不要只数线材根数</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#087e8b"/></marker><marker id="hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b85c12"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="61" font-size="34" fill="#18324a" font-weight="700" text-anchor="start">风扇转速、5V ARGB、12V RGB 是三件事</text><text x="44" y="101" font-size="21" fill="#536779" font-weight="400" text-anchor="start">看电压、看缺针、看功能；不要只数线材根数</text><rect x="40" y="140" width="1120" height="183" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="187" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">4Pin PWM：控制风扇电机转速</text><rect x="55" y="201" width="370" height="113" rx="10" fill="white" stroke="#cbd7e0" stroke-width="2"/><rect x="71" y="227" width="34" height="38" rx="3" fill="#18324a" stroke="none" stroke-width="2"/><text x="88" y="294" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">GND</text><rect x="160" y="227" width="34" height="38" rx="3" fill="#18324a" stroke="none" stroke-width="2"/><text x="177" y="294" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">+12V</text><rect x="249" y="227" width="34" height="38" rx="3" fill="#18324a" stroke="none" stroke-width="2"/><text x="266" y="294" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">转速</text><rect x="338" y="227" width="34" height="38" rx="3" fill="#18324a" stroke="none" stroke-width="2"/><text x="355" y="294" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">PWM</text><text x="495" y="233" font-size="25" fill="#18324a" font-weight="400" text-anchor="start">连接 CPU_FAN / CHA_FAN</text><text x="495" y="276" font-size="25" fill="#18324a" font-weight="400" text-anchor="start">灯线是否接上，不影响这条转速线的定义</text><rect x="40" y="345" width="1120" height="183" rx="16" fill="#e5f5f5" stroke="none" stroke-width="2"/><text x="68" y="392" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">5V ARGB：可寻址灯光，通常“3 针 4 位缺 1 针”</text><rect x="55" y="405" width="370" height="113" rx="10" fill="white" stroke="#cbd7e0" stroke-width="2"/><rect x="71" y="431" width="34" height="38" rx="3" fill="#b85c12" stroke="none" stroke-width="2"/><text x="88" y="498" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">+5V</text><rect x="160" y="431" width="34" height="38" rx="3" fill="#087e8b" stroke="none" stroke-width="2"/><text x="177" y="498" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">Data</text><rect x="249" y="433" width="34" height="34" rx="3" fill="#eef2f5" stroke="#cbd7e0" stroke-width="2"/><text x="266" y="494" font-size="18" fill="#536779" font-weight="400" text-anchor="middle">缺针</text><rect x="338" y="431" width="34" height="38" rx="3" fill="#18324a" stroke="none" stroke-width="2"/><text x="355" y="498" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">GND</text><text x="495" y="437" font-size="25" fill="#087e8b" font-weight="400" text-anchor="start">连接本板 ADD_GEN 2 系列接针</text><text x="495" y="480" font-size="25" fill="#087e8b" font-weight="400" text-anchor="start">插头箭头 / 5V 标记与主板 +5V 对齐</text><rect x="40" y="550" width="1120" height="183" rx="16" fill="#fbecec" stroke="none" stroke-width="2"/><text x="68" y="597" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">12V RGB：另一种灯光接口，禁止接入 5V ARGB 设备</text><rect x="55" y="610" width="370" height="113" rx="10" fill="white" stroke="#cbd7e0" stroke-width="2"/><rect x="71" y="636" width="34" height="38" rx="3" fill="#b33738" stroke="none" stroke-width="2"/><text x="88" y="703" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">+12V</text><rect x="160" y="636" width="34" height="38" rx="3" fill="#087e8b" stroke="none" stroke-width="2"/><text x="177" y="703" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">G</text><rect x="249" y="636" width="34" height="38" rx="3" fill="#b33738" stroke="none" stroke-width="2"/><text x="266" y="703" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">R</text><rect x="338" y="636" width="34" height="38" rx="3" fill="#2865b0" stroke="none" stroke-width="2"/><text x="355" y="703" font-size="18" fill="#18324a" font-weight="500" text-anchor="middle">B</text><text x="495" y="642" font-size="25" fill="#b33738" font-weight="400" text-anchor="start">电压和控制方式都不同，不能互插</text><text x="495" y="685" font-size="25" fill="#b33738" font-weight="400" text-anchor="start">本板灯光接针为 ARGB，勿凭“都是灯线”连接</text><text x="43" y="784" font-size="22" fill="#536779" font-weight="400" text-anchor="start">针脚排列仅解释接口类别；实际插拔必须核对主板丝印、插头防呆和设备说明。</text></g></svg>