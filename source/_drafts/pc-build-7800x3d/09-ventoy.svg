<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="title desc"><title id="title">64GB U 盘：启动与存文件可以共用空间</title><desc id="desc">GPT + exFAT + 默认布局；第一次安装会清空所选 U 盘</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#087e8b"/></marker><marker id="hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b85c12"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="61" font-size="34" fill="#18324a" font-weight="700" text-anchor="start">64GB U 盘：启动与存文件可以共用空间</text><text x="44" y="101" font-size="21" fill="#536779" font-weight="400" text-anchor="start">GPT + exFAT + 默认布局；第一次安装会清空所选 U 盘</text><rect x="40" y="141" width="1120" height="205" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="188" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">旧 U 盘：两个大分区 + 隐藏启动分区</text><rect x="70" y="225" width="480" height="66" rx="6" fill="#d9e5ee" stroke="none" stroke-width="2"/><rect x="560" y="225" width="360" height="66" rx="6" fill="#ccdce9" stroke="none" stroke-width="2"/><rect x="930" y="225" width="200" height="66" rx="6" fill="#fff2df" stroke="none" stroke-width="2"/><text x="310" y="267" font-size="25" fill="#18324a" font-weight="600" text-anchor="middle">E: 32GB</text><text x="740" y="267" font-size="25" fill="#18324a" font-weight="600" text-anchor="middle">F: 26.01GB</text><text x="1030" y="267" font-size="23" fill="#b85c12" font-weight="600" text-anchor="middle">EFI 298MB</text><text x="68" y="323" font-size="22" fill="#536779" font-weight="400" text-anchor="start">在隐藏分区中发现 EFI / WEPE；是否能启动仍需实际验证。</text><path d="M 597 369 L 597 419" fill="none" stroke="#087e8b" stroke-width="6"  marker-end="url(#arr)"/><text x="648" y="401" font-size="24" fill="#087e8b" font-weight="600" text-anchor="start">先备份有用文件，再安装 Ventoy</text><rect x="40" y="444" width="1120" height="255" rx="16" fill="#e5f5f5" stroke="none" stroke-width="2"/><text x="68" y="491" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">Ventoy：共享数据空间 + 独立的小启动分区</text><rect x="70" y="531" width="780" height="80" rx="8" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="868" y="531" width="262" height="80" rx="8" fill="#d4e5e8" stroke="#087e8b" stroke-width="2"/><text x="460" y="580" font-size="25" fill="#087e8b" font-weight="600" text-anchor="middle">exFAT 数据分区：ISO 与普通文件共享</text><text x="999" y="567" font-size="25" fill="#18324a" font-weight="600" text-anchor="middle">VTOYEFI</text><text x="999" y="599" font-size="23" fill="#536779" font-weight="500" text-anchor="middle">约 32MB</text><text x="68" y="659" font-size="23" fill="#18324a" font-weight="400" text-anchor="start">ISO 不用解压；删除某个 ISO 即可释放对应空间。不要删除 Ventoy 的启动分区。</text><text x="43" y="749" font-size="22" fill="#536779" font-weight="400" text-anchor="start">图中分区宽度不按容量比例绘制。64GB 为十进制标称容量，换算约 59.6GiB。</text></g></svg>