<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 825" width="1200" height="825" role="img" aria-labelledby="title desc"><title id="title">内存怎么插：看 A2，不看“就近顺手”</title><desc id="desc">从 CPU 向外依次为 A1、A2、B1、B2；以本板说明书为准</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#087e8b"/></marker><marker id="hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b85c12"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="61" font-size="34" fill="#18324a" font-weight="700" text-anchor="start">内存怎么插：看 A2，不看“就近顺手”</text><text x="44" y="101" font-size="21" fill="#536779" font-weight="400" text-anchor="start">从 CPU 向外依次为 A1、A2、B1、B2；以本板说明书为准</text><rect x="40" y="150" width="1120" height="216" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="197" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">当前：24GB × 1，优先 A2</text><rect x="80" y="232" width="180" height="95" rx="16" fill="#dce6ec" stroke="#cbd7e0" stroke-width="2"/><text x="170" y="291" font-size="29" fill="#18324a" font-weight="600" text-anchor="middle">CPU</text><rect x="360" y="238" width="130" height="72" rx="8" fill="white" stroke="#cbd7e0" stroke-width="2"/><text x="425" y="283" font-size="28" fill="#536779" font-weight="700" text-anchor="middle">A1</text><text x="425" y="342" font-size="22" fill="#536779" font-weight="500" text-anchor="middle">空槽</text><rect x="535" y="238" width="130" height="72" rx="8" fill="#e5f5f5" stroke="#087e8b" stroke-width="2"/><text x="600" y="283" font-size="28" fill="#087e8b" font-weight="700" text-anchor="middle">A2</text><text x="600" y="342" font-size="22" fill="#087e8b" font-weight="500" text-anchor="middle">已占用</text><rect x="710" y="238" width="130" height="72" rx="8" fill="white" stroke="#cbd7e0" stroke-width="2"/><text x="775" y="283" font-size="28" fill="#536779" font-weight="700" text-anchor="middle">B1</text><text x="775" y="342" font-size="22" fill="#536779" font-weight="500" text-anchor="middle">空槽</text><rect x="885" y="238" width="130" height="72" rx="8" fill="white" stroke="#cbd7e0" stroke-width="2"/><text x="950" y="283" font-size="28" fill="#536779" font-weight="700" text-anchor="middle">B2</text><text x="950" y="342" font-size="22" fill="#536779" font-weight="500" text-anchor="middle">空槽</text><rect x="40" y="392" width="1120" height="216" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="68" y="439" font-size="27" fill="#18324a" font-weight="700" text-anchor="start">以后：两条匹配内存，优先 A2 + B2</text><rect x="80" y="474" width="180" height="95" rx="16" fill="#dce6ec" stroke="#cbd7e0" stroke-width="2"/><text x="170" y="533" font-size="29" fill="#18324a" font-weight="600" text-anchor="middle">CPU</text><rect x="360" y="480" width="130" height="72" rx="8" fill="white" stroke="#cbd7e0" stroke-width="2"/><text x="425" y="525" font-size="28" fill="#536779" font-weight="700" text-anchor="middle">A1</text><text x="425" y="584" font-size="22" fill="#536779" font-weight="500" text-anchor="middle">空槽</text><rect x="535" y="480" width="130" height="72" rx="8" fill="#e5f5f5" stroke="#087e8b" stroke-width="2"/><text x="600" y="525" font-size="28" fill="#087e8b" font-weight="700" text-anchor="middle">A2</text><text x="600" y="584" font-size="22" fill="#087e8b" font-weight="500" text-anchor="middle">已占用</text><rect x="710" y="480" width="130" height="72" rx="8" fill="white" stroke="#cbd7e0" stroke-width="2"/><text x="775" y="525" font-size="28" fill="#536779" font-weight="700" text-anchor="middle">B1</text><text x="775" y="584" font-size="22" fill="#536779" font-weight="500" text-anchor="middle">空槽</text><rect x="885" y="480" width="130" height="72" rx="8" fill="#e5f5f5" stroke="#087e8b" stroke-width="2"/><text x="950" y="525" font-size="28" fill="#087e8b" font-weight="700" text-anchor="middle">B2</text><text x="950" y="584" font-size="22" fill="#087e8b" font-weight="500" text-anchor="middle">已占用</text><rect x="40" y="660" width="1120" height="133" rx="16" fill="#edf3fb" stroke="none" stroke-width="2"/><text x="67" y="704" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">单条 DDR5 UDIMM 内部有两个 32-bit 子通道，总数据位宽仍是 64-bit。</text><text x="67" y="747" font-size="24" fill="#18324a" font-weight="400" text-anchor="start">A2 + B2 可利用处理器两个内存通道；不要把两种“通道”混为一谈。</text></g></svg>