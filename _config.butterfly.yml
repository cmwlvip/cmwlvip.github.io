# --------------------------------------
# Math (数学)
# --------------------------------------
# About the per_page
# if you set it to true, it will load mathjax/katex script in each page
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' or 'katex: true' in page's front-matter)
math:
  # Choose: mathjax, katex
  # Leave it empty if you don't need math
  use: mathjax
  per_page: false
  hide_scrollbar: false

  mathjax:
    # Enable the contextual menu
    enableMenu: true
    # Choose: all / ams / none, This controls whether equations are numbered and how
    tags: none

  katex:
    # Enable the copy KaTeX formula
    copy_tex: false


# 旧版
# # MathJax
# mathjax:
#   enable: true
#   per_page: false
# # KaTeX
# katex:
#   enable: false
#   per_page: false
#   hide_scrollbar: true


# --------------------------------------
# Image Settings(图片设置)
# --------------------------------------

# Favicon（网站图标）
favicon: /img/favicon01.png

# Avatar (头像)
avatar:
# https://i.loli.net/2021/02/24/5O1day2nriDzjSu.png
  img: 
    # - /img/avatar001.gif #原avatar001.gif https://pic.imgdb.cn/item/63f9a201f144a01007f396ea.gif(压缩后)
    - /img/avatar002.jpg  #公孙离
    # - /img/avatar004.jpg
    # - /img/avatar005.jpg #风景
    # - /img/avatar001.jpg
  # 旋转
  effect: false

# Disable all banner image
disable_top_img: false

# If the banner of page not setting, it will show the top_img
default_top_img: /img/wallpaper001.jpg

# The banner image of home page
index_img: /img/wallpaper001.jpg

# The banner image of archive page
archive_img:

# If the banner of tag page not setting, it will show the top_img
# note: tag page, not tags page (子标签页面的 top_img)
tag_img:

# The banner image of tag page
# format:
#  - tag name: xxxxx
tag_per_img:

# If the banner of category page not setting, it will show the top_img
# note: category page, not categories page (子分类页面的 top_img)
category_img:

# The banner image of category page
# format:
#  - category name: xxxxx
category_per_img:

# The background image of footer
#transparent:透明, true:和index_img一致
footer_img: true

# Website Background
# Can set it to color, image URL or an array containing colors and/or image URLs
# If an array is provided, a random background will be selected from the array on each load
background: 
  - /img/bg01.png
  - /img/bg02.png
  # - /img/bg002.png
  # - /img/bg003.png
  # - /img/bg004.png
  # - /img/bg005.png

cover:
  # display the cover or not (是否显示文章封面)
  index_enable: true
  aside_enable: true
  archives_enable: true
  # the position of cover in home page (封面顯示的位置)
  # left/right/both
  position: both
  # When cover is not set, the default cover is displayed (當沒有設置cover時，默認的封面顯示)
  default_cover:
    - /img/cover001.jpg
    - /img/cover002.jpg
    # - /img/bg_png004.png
    # - /img/bg_png005.png
    # - https://i.loli.net/2020/05/01/gkihqEjXxJ5UZ1C.jpg

# Replace Broken Images (替換無法顯示的圖片)
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page
error_404:
  enable: true
  subtitle: 'Page Not Found'
  background: /img/error-page.png
              # -https://i.loli.net/2020/05/19/aKOcLiyPl2JQdFD.png

post_meta:
  page: # Home Page
    date_type: both # created or updated or both 主頁文章日期是創建日或者更新日或都顯示
    date_format: date # date/relative 顯示日期還是相對日期
    categories: true # true or false 主頁是否顯示分類
    tags: false # true or false 主頁是否顯示標籤
    label: true # true or false 顯示描述性文字
  post:
    # Choose: left / center（v5.5）
    position: left
    date_type: both # created or updated or both 文章頁日期是創建日或者更新日或都顯示
    date_format: date # date/relative 顯示日期還是相對日期
    categories: true # true or false 文章頁是否顯示分類
    tags: true # true or false 文章頁是否顯示標籤
    label: true # true or false 顯示描述性文字

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle (默认top_img全屏，site_info在中间)
# The position of site info, eg: 300px/300em/300rem/10% (主页标题距离顶部的距离)
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem (主頁top_img高度)
index_top_img_height:

# The subtitle on homepage
# The subtitle on homepage
subtitle:
  enable: true
  # Typewriter Effect
  effect: true
  # Customize typed.js
  # https://github.com/mattboldt/typed.js/#customization
  #（5.5有变动，没有下面选项，新增typed_option:）
  # Effect Speed Options (打字效果速度参数)
  startDelay: 300 # time before typing starts in milliseconds
  typeSpeed: 150 # type speed in milliseconds
  backSpeed: 50 # backspacing speed in milliseconds
  # loop (循环打字)
  loop: true
  typed_option:
  # Source - Call the third-party service API (Chinese only)调用第三方服务
  # It will show the source first, then show the content of sub
  # Choose: false/1/2/3
  # false - disable the function
  # 1 - https://hitokoto.cn
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - https://www.jinrishici.com/
   # subtitle 会先显示 source , 再顯示 sub 的內容
  source: false
  # If you close the typewriter effect, the subtitle will only show the first line of sub
  sub:
     - 没有人想让你输，除非你自己不想赢
     - 既然目标是地平线，留给世界的只能是背影
# 文章布局，默认3
# Article layout on the homepage
# 1: Cover on the left, info on the right
# 2: Cover on the right, info on the left
# 3: Cover and info alternate between left and right
# 4: Cover on top, info on the bottom
# 5: Info displayed on the cover
# 6: Masonry layout - Cover on top, info on the bottom
# 7: Masonry layout - Info displayed on the cover
index_layout: 3

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 2
  # If you set method to 2 or 3, the length need to config
  length: 500


# Post
# --------------------------------------

# toc (目录)
toc:
  post: true
  page: false
  number: true
  expand: false
  # Only for post
  style_simple: false # (侧边栏只显示TOC，只对文章页面有效)
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: true
  QR_code:
    - img: /img/wechat.png
      link:
      text: wechat
    - img: /img/alipay.jpg
      link:
      text: alipay

# Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# Related Articles
related_post:
  enable: true
  limit: 6 # Number of posts displayed
  date_type: created # or created or updated 文章日期顯示創建日或者更新日

# post_pagination (分页)
# value: 1 || 2 || false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 2

# Displays outdated notice for a post (文章过期提醒)
noticeOutdate:
  enable: true
  style: flat # style: simple/flat
  limit_day: 365 # When will it be shown
  position: bottom # position: top/bottom
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

