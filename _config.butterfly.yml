# --------------------------------------(v5.5版本更新)
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo:
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: false


# Main menu navigation (導航目錄)
# see https://butterfly.js.org/posts/4aa8abbe/#導航菜單
# --------------------------------------

menu:
  Home: / || fas fa-home
  List||fas fa-list:
    Archives: /archives/ || fas fa-archive
    Tags: /tags/ || fas fa-tags
    Categories: /categories/ || fas fa-folder-open
  Fun||fas fa-heart-pulse:
    Book: /books/ || fas fa-book-open
    Movie: /movies/ || fas fa-video
    Game: /games/ || fab fa-steam
    Song: /songs/ || fas fa-music
    Music: /music/ || fas fa-headphones
  Tools||fas fa-wrench:
    Translation: /translation/ || fas fa-language
  Link: /link/ || fas fa-link
  Reference|| fas fa-star:
    Acwing: /2023/02/26/acwing/ || fas fa-arrow-right
    实用快捷键: /2022/11/03/KeyboardShutcut/ || fas fa-arrow-right
    了不起的 Markdown: /2022/10/27/TheCharmOfMarkdown/ || fas fa-arrow-right
    Hexo Built-in Tag Plugins: /2022/11/03/HexoTagPlugins/ || fas fa-arrow-right

  # About: /about/ || fas fa-heart

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: 400
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  # 原highlight_shrink
  shrink: false
  fullpage: false

# 大变化
# highlight_theme: light #  darker / pale night / light / ocean / mac / mac light / false
# highlight_copy: true # copy button
# highlight_lang: true # show the code language
# highlight_shrink: false # true: shrink the code blocks / false: expand the code blocks | none: expand code blocks and hide the button
# highlight_height_limit: 400 # unit: px//代码限高
# code_word_wrap: false

# social settings (社交图标设置)
# formal:
#   icon: link || the description
# mailto:xxxxxx@gmail.com || Email
# Formal:(v5.5)
#   icon: link || the description || color
social:
  # fab fa-github: https://github.com/xxxxx || Github || '#24292e'
  fab fa-github: https://github.com/cmwlvip || Github
  fab fa-git: https://gitee.com/cmwlvip || Gitee
  fas fa-envelope: mailto:2689050828@qq.com || Email

search:
  # Choose: algolia_search / local_search / docsearch
  # leave it empty if you don't need search
  use: local_search
  placeholder: 搜寻文章

  # Algolia Search
  algolia_search:
    # Number of search results per page
    hitsPerPage: 6

  # Local Search
  local_search:
    # Preload the search data when the page loads.
    preload: false
    # Show top n results per article, show all results by setting to -1
    top_n_per_article: -1
    # Unescape html strings to the readable one.
    unescape: false
    # Enable pagination for search results
    pagination:
      enable: true
      # Number of search results per page
      hitsPerPage: 8
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

